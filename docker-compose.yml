services: 
  mysql-commande:
    image: mysql:8.0
    container_name: mysql-commande
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: service_commande
    ports:
      - "3309:3306"
    volumes:
      - mysql_data_commande:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [ms-net]

  service-commande:
    image: ghcr.io/kuetcheal/service_commande:${TAG:-develop}
    container_name: service-commande
    depends_on:
      mysql-commande:
        condition: service_healthy

    env_file:
      - C:/Users/epsiap/secrets/.env.jwt

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-commande:3306/service_commande?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      SERVER_PORT: 8080
      MANAGEMENT_SERVER_PORT: 8082
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,prometheus,metrics
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

    ports:
      - "8084:8080"   # API externe seulement
      - "8082:8082"   # Actuator Prometheus
    restart: unless-stopped
    networks: [ms-net]

volumes:
  mysql_data_commande:

networks:
  ms-net:
    external: true
