services:
  mysql:
    image: mysql:8.0
    container_name: mysql_commande
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: service_commande
    ports:
      - "3309:3306"
    volumes:
      - mysql_data_commande:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [ms-net]

  service_commande:
    build: .
    container_name: service_commande
    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - C:/Users/epsiap/secrets/.env.jwt

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql_commande:3306/service_commande?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      # Broker partagé du repo service_client
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest

      SERVER_PORT: 8080
      JWT_SECRET: "mYmvI1eMKEhT8/LciNCcJqyqSg9XKzTuNNmemn0fAnA="
    ports:
      - "8084:8080"         # <-- change ici
    restart: unless-stopped
    networks: [ms-net]

volumes:
  mysql_data_commande:

networks:
  ms-net:
    external: true
